[project]
name = "clipline-backend"
version = "0.9.5" # x-release-please-version
description = "Clipline phase-one NAS backend"
requires-python = ">=3.11,<3.13"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0,<2.1",
  "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8,<10",
    "ruff>=0.6,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
