<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clipline — 任务中心 (视频导出 & ASR 语音识别队列)</title>
<meta name="description" content="Clipline 任务中心，管理后台视频导出与语音识别任务">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg-primary: #0a0a0f;
  --bg-secondary: #141419;
  --bg-tertiary: #1c1c24;
  --bg-elevated: #232330;
  --border-primary: rgba(255,255,255,0.06);
  --border-secondary: rgba(255,255,255,0.1);
  --text-primary: #f5f5f7;
  --text-secondary: #a1a1a6;
  --text-tertiary: #6e6e73;
  --accent-blue: #0a84ff;
  --accent-blue-dim: rgba(10,132,255,0.15);
  --accent-green: #30d158;
  --accent-teal: #64d2ff;
  --accent-purple: #bf5af2;
  --font: 'Inter', -apple-system, sans-serif;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-pill: 100px;
  --shadow-lg: 0 20px 60px rgba(0,0,0,0.5);
  --shadow-glow: 0 0 20px rgba(10,132,255,0.15);
  --ease: cubic-bezier(0.25, 0.46, 0.45, 0.94);
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --rail-width: 72px;
  --topbar-height: 56px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; font-family: var(--font); background: var(--bg-primary); color: var(--text-primary); }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-thumb { background: var(--text-tertiary); border-radius: 3px; }

.shell {
  display: grid;
  grid-template-columns: var(--rail-width) 1fr;
  grid-template-rows: var(--topbar-height) 1fr;
  height: 100vh;
}

/* ── Rail ── */
.rail {
  grid-row: 1 / -1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 16px 0 20px;
  background: var(--bg-secondary); border-right: 1px solid var(--border-primary); z-index: 10;
}
.rail-logo {
  width: 40px; height: 40px; border-radius: var(--radius-md); background: linear-gradient(135deg, #0a84ff, #5e5ce6);
  display: grid; place-items: center; margin-bottom: 20px; position: relative;
}
.rail-logo svg { width: 22px; height: 22px; fill: white; }
.rail-logo-status { position: absolute; right: -1px; top: -1px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent-green); border: 2px solid var(--bg-secondary); }

.rail-btn {
  display: flex; flex-direction: column; align-items: center; gap: 3px; width: 56px; padding: 8px 0 6px;
  border-radius: var(--radius-md); color: var(--text-tertiary); transition: all 0.2s var(--ease); text-decoration: none;
}
.rail-btn:hover { background: var(--bg-tertiary); color: var(--text-secondary); }
.rail-btn.active { background: var(--accent-blue-dim); color: var(--accent-blue); }
.rail-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; }
.rail-btn span { font-size: 10px; font-weight: 600; }
.rail-spacer { flex: 1; }

/* ── Topbar ── */
.topbar {
  display: flex; align-items: center; gap: 12px; padding: 0 24px;
  background: rgba(20,20,25,0.72); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.08); z-index: 5;
}
.topbar-title h1 { font-size: 16px; font-weight: 700; color: var(--text-primary); }
.topbar-title p { font-size: 11px; font-weight: 500; color: var(--text-tertiary); }

/* ── Main Task Center Content ── */
.task-stage {
  display: flex;
  flex-direction: column;
  padding: 24px;
  min-height: 0;
  overflow-y: auto;
  gap: 20px;
}

.task-tabs {
  display: flex;
  gap: 8px;
  border-bottom: 1px solid var(--border-primary);
  padding-bottom: 12px;
}
.tab-item {
  padding: 6px 16px;
  border-radius: var(--radius-pill);
  background: var(--bg-tertiary);
  color: var(--text-secondary);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  border: 1px solid var(--border-primary);
}
.tab-item.active {
  background: var(--accent-blue);
  color: white;
  border-color: var(--accent-blue);
}

.task-section-header {
  font-size: 14px;
  font-weight: 700;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 8px;
}
.task-section-header svg { width: 16px; height: 16px; stroke: var(--accent-blue); fill: none; stroke-width: 2; }

.task-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.task-card {
  padding: 16px;
  border-radius: var(--radius-lg);
  background: var(--bg-secondary);
  border: 1px solid var(--border-primary);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  transition: all 0.2s;
}
.task-card:hover { border-color: var(--border-secondary); box-shadow: var(--shadow-lg); }

.task-info { display: flex; align-items: center; gap: 14px; }
.status-icon {
  width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0;
}
.status-icon.done { background: var(--bg-elevated); color: var(--accent-green); }
.status-icon.running { background: var(--accent-blue-dim); color: var(--accent-blue); }
.status-icon.asr { background: rgba(100,210,255,0.15); color: var(--accent-teal); }
.status-icon svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.2; }

.task-title { font-size: 14px; font-weight: 700; color: var(--text-primary); }
.task-meta { font-size: 11px; font-weight: 500; color: var(--text-tertiary); margin-top: 2px; }

.progress-wrap { width: 180px; }
.progress-bar-bg { height: 6px; border-radius: 3px; background: var(--bg-elevated); overflow: hidden; }
.progress-bar-val { height: 100%; background: var(--accent-blue); border-radius: 3px; transition: width 0.3s; }

.download-btn {
  height: 32px; padding: 0 14px; border-radius: var(--radius-pill); background: var(--bg-tertiary);
  border: 1px solid var(--border-primary); color: var(--text-primary); font-size: 12px; font-weight: 700;
  display: flex; align-items: center; gap: 6px; transition: all 0.2s;
}
.download-btn:hover { background: var(--accent-blue); color: white; border-color: var(--accent-blue); }
.download-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }

.toast {
  position: fixed; bottom: 24px; right: 24px; z-index: 100; padding: 12px 20px;
  border-radius: var(--radius-md); background: var(--bg-elevated); border: 1px solid var(--border-secondary);
  box-shadow: var(--shadow-lg); color: var(--text-primary); font-size: 13px; font-weight: 600;
  opacity: 0; transform: translateY(16px); transition: all 0.35s var(--spring); pointer-events: none;
}
.toast.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
</style>
</head>
<body>

<div class="shell">
  <!-- ═══ Rail ═══ -->
  <nav class="rail">
    <a href="playback.html" class="rail-logo" title="Clipline"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><span class="rail-logo-status"></span></a>
    <div class="rail-nav">
      <a href="playback.html" class="rail-btn"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg><span>回放</span></a>
      <a href="clips.html" class="rail-btn"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg><span>片段</span></a>
      <a href="tasks.html" class="rail-btn active"><svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg><span>任务</span></a>
      <a href="sources.html" class="rail-btn"><svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg><span>录像源</span></a>
    </div>
    <div class="rail-spacer"></div>
    <div class="rail-nav">
      <a href="settings.html" class="rail-btn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span>设置</span></a>
    </div>
  </nav>

  <!-- ═══ Topbar ═══ -->
  <header class="topbar">
    <div class="topbar-title">
      <h1>任务中心</h1>
      <p>后台视频导出与 ASR 语音识别处理队列 (对应 TaskCenterView 代码)</p>
    </div>
  </header>

  <!-- ═══ Main Task Stage ═══ -->
  <main class="task-stage">
    <div class="task-tabs">
      <div class="tab-item active">全部任务 (5)</div>
      <div class="tab-item">视频导出 (3)</div>
      <div class="tab-item">语音识别 ASR (2)</div>
    </div>

    <!-- Section 1: 视频导出任务 -->
    <div>
      <div class="task-section-header" style="margin-bottom:12px;">
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        视频剪辑与导出任务
      </div>
      <div class="task-list">
        <div class="task-card">
          <div class="task-info">
            <div class="status-icon done"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
            <div>

              <div class="task-meta">快速导出 · 15.4 MB · 已完成</div>
            </div>
          </div>
          <button class="download-btn" onclick="showToast('正在开始下载 mp4 文件')">
            <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            下载 MP4
          </button>
        </div>

        <div class="task-card">
          <div class="task-info">
            <div class="status-icon running"><svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15A9 9 0 1 1 22 12"/></svg></div>
            <div>
              <div class="task-title">行车记录仪 · 10:02:00 - 10:12:30</div>
              <div class="task-meta">精准重编码导出 · 导出中 65%</div>
            </div>
          </div>
          <div class="progress-wrap">
            <div class="progress-bar-bg"><div class="progress-bar-val" style="width:65%"></div></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Section 2: 语音识别 ASR 队列 (代码中独有功能) -->
    <div>
      <div class="task-section-header" style="margin-bottom:12px;">
        <svg viewBox="0 0 24 24" style="stroke:var(--accent-teal)"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>

      </div>
      <div class="task-list">
        <div class="task-card">
          <div class="task-info">
            <div class="status-icon asr"><svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/></svg></div>
            <div>
              <div class="task-title">门口摄像头 · 09:35:48 片段 (5分22秒)</div>
              <div class="task-meta">FunASR (base) 模型 · 已完成识别 · 提取到 5 条对话</div>
            </div>
          </div>
          <a href="playback.html" class="download-btn" style="text-decoration:none;">查看对话</a>
        </div>
      </div>
    </div>

  </main>
</div>

<div class="toast" id="toast"><span id="toastMsg">提示</span></div>

<script>
function showToast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2500);
}
</script>
</body>
</html>
