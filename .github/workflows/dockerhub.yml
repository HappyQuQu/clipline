name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dockerhub-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: evanqu/clipline

jobs:
  checks:
    uses: ./.github/workflows/phase-one-checks.yml

  publish:
    name: Promote tested candidates
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            VERSION=$(python3 deploy/validate_release.py --tag "$REF_NAME")
          else
            VERSION=$(python3 deploy/validate_release.py)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-*
          path: candidates
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push exact tested architecture images and candidate manifest
        env:
          REVISION: ${{ github.sha }}
        run: |
          for ARCH in amd64 arm64; do
            docker load -i "candidates/candidate-$ARCH/image.tar"
            ACTUAL=$(docker image inspect clipline:ci --format '{{.Id}}')
            test "$ACTUAL" = "$(cat "candidates/candidate-$ARCH/image-id.txt")"
            docker tag clipline:ci "$IMAGE_NAME:candidate-$REVISION-$ARCH"
            docker push "$IMAGE_NAME:candidate-$REVISION-$ARCH"
          done
          docker buildx imagetools create -t "$IMAGE_NAME:candidate-$REVISION" \
            "$IMAGE_NAME:candidate-$REVISION-amd64" "$IMAGE_NAME:candidate-$REVISION-arm64"
          docker buildx imagetools inspect "$IMAGE_NAME:candidate-$REVISION" --raw > candidate-manifest.json
          python3 deploy/check_manifest.py candidate-manifest.json
      - name: Promote candidate after manifest verification
        env:
          REVISION: ${{ github.sha }}
          VERSION: ${{ steps.version.outputs.version }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            # Publish immutable version first; stable pointer is the final operation.
            if docker buildx imagetools inspect "$IMAGE_NAME:$VERSION" --raw > existing-manifest.json 2>/dev/null; then
              python3 deploy/check_manifest.py candidate-manifest.json --existing existing-manifest.json
            else
              docker buildx imagetools create -t "$IMAGE_NAME:$VERSION" "$IMAGE_NAME:candidate-$REVISION"
            fi
            docker buildx imagetools create -t "$IMAGE_NAME:latest" "$IMAGE_NAME:$VERSION"
          else
            docker buildx imagetools create -t "$IMAGE_NAME:edge" "$IMAGE_NAME:candidate-$REVISION"
          fi
      - name: Update Docker Hub overview
        uses: peter-evans/dockerhub-description@e98e4d1628a5f3be2be7c231e50981aee98723ae
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_DESCRIPTION_TOKEN || secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE_NAME }}
          readme-filepath: README.dockerhub.md
          short-description: NAS recording replay and export workbench for amd64 and arm64.
