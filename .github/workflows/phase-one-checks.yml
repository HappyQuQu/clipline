name: Phase-one checks

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.20"
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - name: Install FFmpeg for media integration tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: uv run --frozen ruff check . ../deploy
      - run: uv run --frozen ruff format --check . ../deploy
      - run: uv run --frozen pytest -q
      - run: uv run --frozen python ../deploy/validate_release.py
      - name: Check Docker dependency export
        run: |
          uv export --frozen --no-dev --no-emit-project -o requirements.lock > /dev/null
          git diff --exit-code -- requirements.lock

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm test
      - run: npm run build

  native-image:
    name: Native image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build candidate without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: clipline:ci
          cache-from: type=gha,scope=native-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=native-${{ matrix.arch }}
      - name: Inspect and exercise exact candidate on native hardware
        run: |
          python3 deploy/check_image.py --image clipline:ci
          python3 deploy/smoke_release.py --image clipline:ci --require-native --output "$RUNNER_TEMP/d6"
      - name: Save tested image
        run: |
          mkdir -p "$RUNNER_TEMP/candidate"
          docker save clipline:ci -o "$RUNNER_TEMP/candidate/image.tar"
          docker image inspect clipline:ci --format '{{.Id}}' > "$RUNNER_TEMP/candidate/image-id.txt"
          cp "$RUNNER_TEMP/d6/results.json" "$RUNNER_TEMP/candidate/acceptance.json"
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ matrix.arch }}
          path: ${{ runner.temp }}/candidate/
          retention-days: 3
          compression-level: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-evidence-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/d6/results.json
            ${{ runner.temp }}/d6/*/container.log
          retention-days: 7
          if-no-files-found: ignore
