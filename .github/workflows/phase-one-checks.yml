name: Phase-one checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.20"
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run --frozen ruff check . ../deploy/smoke_foundation.py
      - run: uv run --frozen ruff format --check . ../deploy/smoke_foundation.py
      - run: uv run --frozen pytest -q
      - name: Check Docker dependency export
        run: |
          uv export --frozen --no-dev --no-emit-project -o requirements.lock > /dev/null
          git diff --exit-code -- requirements.lock

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm test
      - run: npm run build
