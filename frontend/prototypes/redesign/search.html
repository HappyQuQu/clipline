<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clipline — 语音对话全文检索 (SearchStage)</title>
<meta name="description" content="Clipline 语音字幕全文搜索与检索结果分析">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg-primary: #0a0a0f;
  --bg-secondary: #141419;
  --bg-tertiary: #1c1c24;
  --bg-elevated: #232330;
  --border-primary: rgba(255,255,255,0.06);
  --border-secondary: rgba(255,255,255,0.1);
  --text-primary: #f5f5f7;
  --text-secondary: #a1a1a6;
  --text-tertiary: #6e6e73;
  --accent-blue: #0a84ff;
  --accent-blue-dim: rgba(10,132,255,0.15);
  --accent-green: #30d158;
  --accent-teal: #64d2ff;
  --font: 'Inter', -apple-system, sans-serif;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-pill: 100px;
  --shadow-lg: 0 20px 60px rgba(0,0,0,0.5);
  --shadow-glow: 0 0 20px rgba(10,132,255,0.15);
  --ease: cubic-bezier(0.25, 0.46, 0.45, 0.94);
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --rail-width: 72px;
  --topbar-height: 56px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; font-family: var(--font); background: var(--bg-primary); color: var(--text-primary); }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, select { font-family: inherit; }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-thumb { background: var(--text-tertiary); border-radius: 3px; }

.shell {
  display: grid;
  grid-template-columns: var(--rail-width) 1fr;
  grid-template-rows: var(--topbar-height) 1fr;
  height: 100vh;
}

/* ── Rail ── */
.rail {
  grid-row: 1 / -1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 16px 0 20px;
  background: var(--bg-secondary); border-right: 1px solid var(--border-primary); z-index: 10;
}
.rail-logo {
  width: 40px; height: 40px; border-radius: var(--radius-md); background: linear-gradient(135deg, #0a84ff, #5e5ce6);
  display: grid; place-items: center; margin-bottom: 20px; position: relative;
}
.rail-logo svg { width: 22px; height: 22px; fill: white; }
.rail-logo-status { position: absolute; right: -1px; top: -1px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent-green); border: 2px solid var(--bg-secondary); }

.rail-btn {
  display: flex; flex-direction: column; align-items: center; gap: 3px; width: 56px; padding: 8px 0 6px;
  border-radius: var(--radius-md); color: var(--text-tertiary); transition: all 0.2s var(--ease); text-decoration: none;
}
.rail-btn:hover { background: var(--bg-tertiary); color: var(--text-secondary); }
.rail-btn.active { background: var(--accent-blue-dim); color: var(--accent-blue); }
.rail-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; }
.rail-btn span { font-size: 10px; font-weight: 600; }
.rail-spacer { flex: 1; }

/* ── Topbar ── */
.topbar {
  display: flex; align-items: center; gap: 12px; padding: 0 24px;
  background: rgba(20,20,25,0.72); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.08); z-index: 5;
}
.topbar-title h1 { font-size: 16px; font-weight: 700; color: var(--text-primary); }
.topbar-title p { font-size: 11px; font-weight: 500; color: var(--text-tertiary); }
.topbar-spacer { flex: 1; }

.search-box {
  display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 16px;
  background: var(--bg-tertiary); border: 1px solid var(--accent-blue); border-radius: var(--radius-pill);
  width: 420px; box-shadow: var(--shadow-glow);
}
.search-box svg { width: 16px; height: 16px; stroke: var(--accent-blue); fill: none; stroke-width: 2; flex-shrink: 0; }
.search-box input { flex: 1; background: none; border: none; outline: none; color: var(--text-primary); font-size: 14px; font-weight: 600; }

.topbar-btn {
  height: 32px; padding: 0 14px; border-radius: var(--radius-pill); background: var(--bg-tertiary);
  border: 1px solid var(--border-primary); color: var(--text-secondary); font-size: 12px; font-weight: 700;
  display: flex; align-items: center; gap: 6px; text-decoration: none;
}
.topbar-btn:hover { border-color: var(--accent-blue); color: var(--accent-blue); }

/* ── Main Search Stage ── */
.main-stage {
  display: grid;
  grid-template-columns: 380px 1fr;
  min-height: 0;
  overflow: hidden;
}

/* Left Search Filters & Hits List */
.search-sidebar {
  display: flex;
  flex-direction: column;
  background: var(--bg-secondary);
  border-right: 1px solid var(--border-primary);
  min-height: 0;
  overflow: hidden;
}

.filter-bar {
  padding: 16px;
  border-bottom: 1px solid var(--border-primary);
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.filter-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.filter-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-tertiary);
  margin-bottom: 4px;
}
.filter-select, .filter-date {
  width: 100%;
  height: 32px;
  padding: 0 8px;
  background: var(--bg-tertiary);
  border: 1px solid var(--border-primary);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-size: 12px;
  font-weight: 600;
  outline: none;
  color-scheme: dark;
}

.hits-header {
  padding: 12px 16px 8px;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-tertiary);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.hits-count {
  color: var(--accent-blue);
  font-weight: 800;
}

.hits-list {
  flex: 1;
  overflow-y: auto;
  padding: 0 16px 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.hit-card {
  padding: 12px;
  border-radius: var(--radius-md);
  background: var(--bg-tertiary);
  border: 1px solid var(--border-primary);
  cursor: pointer;
  transition: all 0.2s var(--ease);
}
.hit-card:hover {
  border-color: var(--border-secondary);
  background: var(--bg-elevated);
}
.hit-card.active {
  border-color: var(--accent-blue);
  background: var(--accent-blue-dim);
  box-shadow: var(--shadow-glow);
}
.hit-card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}
.hit-source {
  font-size: 11px;
  font-weight: 700;
  color: var(--accent-teal);
}
.hit-time {
  font-size: 10px;
  font-weight: 600;
  color: var(--text-tertiary);
}
.hit-snippet {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-primary);
  line-height: 1.4;
}
.hit-snippet mark {
  background: rgba(10,132,255,0.35);
  color: #fff;
  border-radius: 3px;
  padding: 0 3px;
  font-weight: 700;
}

/* Right Detail Preview Panel */
.preview-panel {
  display: flex;
  flex-direction: column;
  background: var(--bg-primary);
  min-height: 0;
  overflow: hidden;
  padding: 24px;
  gap: 20px;
}

.preview-player {
  aspect-ratio: 16 / 9;
  max-height: 380px;
  background: #000;
  border-radius: var(--radius-lg);
  overflow: hidden;
  position: relative;
  border: 1px solid var(--border-secondary);
  box-shadow: var(--shadow-lg);
}

.preview-player .video-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg,#0d1117 0%,#1a1e2a 100%);
  display: flex;
  align-items: center;
  justify-content: center;
}
.preview-player .play-btn-lg {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: var(--accent-blue);
  display: grid;
  place-items: center;
  box-shadow: 0 0 30px rgba(10,132,255,0.4);
}
.preview-player .play-btn-lg svg { width: 28px; height: 28px; fill: white; margin-left: 3px; }

.preview-player-subtitle {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  padding: 8px 18px;
  border-radius: var(--radius-pill);
  background: rgba(10,10,15,0.85);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.12);
  color: white;
  font-size: 14px;
  font-weight: 600;
}
.preview-player-subtitle mark {
  background: var(--accent-blue);
  color: white;
  border-radius: 3px;
  padding: 0 4px;
}

.preview-dialogue-list {
  flex: 1;
  background: var(--bg-secondary);
  border: 1px solid var(--border-primary);
  border-radius: var(--radius-lg);
  padding: 16px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.dialogue-row {
  display: flex;
  gap: 12px;
  padding: 10px 14px;
  border-radius: var(--radius-md);
  background: var(--bg-tertiary);
  border: 1px solid var(--border-primary);
}
.dialogue-row.matched {
  border-color: var(--accent-blue);
  background: var(--accent-blue-dim);
}
.dialogue-time {
  font-size: 12px;
  font-weight: 700;
  color: var(--accent-teal);
  font-variant-numeric: tabular-nums;
  flex-shrink: 0;
}
.dialogue-content {
  font-size: 13px;
  color: var(--text-primary);
  line-height: 1.4;
}

.toast {
  position: fixed; bottom: 24px; right: 24px; z-index: 100; padding: 12px 20px;
  border-radius: var(--radius-md); background: var(--bg-elevated); border: 1px solid var(--border-secondary);
  box-shadow: var(--shadow-lg); color: var(--text-primary); font-size: 13px; font-weight: 600;
  opacity: 0; transform: translateY(16px); transition: all 0.35s var(--spring); pointer-events: none;
}
.toast.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
</style>
</head>
<body>

<div class="shell">
  <!-- ═══ Rail ═══ -->
  <nav class="rail">
    <a href="playback.html" class="rail-logo" title="Clipline">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <span class="rail-logo-status"></span>
    </a>
    <div class="rail-nav">
      <a href="playback.html" class="rail-btn"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg><span>回放</span></a>
      <a href="clips.html" class="rail-btn"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg><span>片段</span></a>
      <a href="tasks.html" class="rail-btn"><svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg><span>任务</span></a>
      <a href="sources.html" class="rail-btn"><svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg><span>录像源</span></a>
    </div>
    <div class="rail-spacer"></div>
    <div class="rail-nav">
      <a href="settings.html" class="rail-btn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span>设置</span></a>
    </div>
  </nav>

  <!-- ═══ Topbar ═══ -->
  <header class="topbar">
    <div class="topbar-title">
      <h1>语音字幕检索</h1>
      <p>全文搜索 ASR 提取的每一句对话</p>
    </div>
    <div class="topbar-spacer"></div>
    <div class="search-box">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" value="快递" placeholder="输入搜索关键词..." id="searchInput">
    </div>
    <a href="playback.html" class="topbar-btn">返回回放</a>
  </header>

  <!-- ═══ Search Stage Body ═══ -->
  <main class="main-stage">
    <!-- Left Sidebar: Filters & Results List -->
    <aside class="search-sidebar">
      <div class="filter-bar">
        <div class="filter-row">
          <div>
            <div class="filter-label">录像源</div>
            <select class="filter-select"><option>全部源</option><option>门口摄像头</option><option>行车记录仪</option></select>
          </div>
          <div>
            <div class="filter-label">包含语音</div>
            <select class="filter-select"><option>全部片段</option><option>仅有对话</option></select>
          </div>
        </div>
      </div>

      <div class="hits-header">
        <span>检索结果</span>
        <span class="hits-count">命中 4 条对话</span>
      </div>

      <div class="hits-list" id="hitsList"></div>
    </aside>

    <!-- Right Preview Panel: Highlighting Context & Player -->
    <section class="preview-panel">
      <div class="preview-player">
        <div class="video-overlay">
          <button class="play-btn-lg" onclick="showToast('正在从命中时间点 00:07 播放')">
            <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          </button>
        </div>
        <div class="preview-player-subtitle">
          00:07 你好，<mark>快递</mark>帮你放在门口了。
        </div>
      </div>

      <div class="preview-dialogue-list">
        <div style="font-size:12px;font-weight:700;color:var(--text-tertiary);margin-bottom:4px;">片段上下文对话 (门口摄像头 · 7/29 14:22:30)</div>
        <div class="dialogue-row matched">
          <span class="dialogue-time">00:07</span>
          <span class="dialogue-content">你好，<mark style="background:var(--accent-blue);color:#fff;border-radius:3px;padding:0 3px;">快递</mark>帮你放在门口了。</span>
        </div>
        <div class="dialogue-row">
          <span class="dialogue-time">00:15</span>
          <span class="dialogue-content">好的，非常感谢！顺便帮我关下门。</span>
        </div>
        <div class="dialogue-row">
          <span class="dialogue-time">00:28</span>
          <span class="dialogue-content">没问题，我已经顺手带上了。</span>
        </div>
      </div>
    </section>
  </main>
</div>

<div class="toast" id="toast"><span id="toastMsg">提示信息</span></div>

<script>
const searchHits = [
  { id:1, source:'门口摄像头', time:'7/29 14:23:07', text:'你好，<mark>快递</mark>帮你放在门口了。' },
  { id:2, source:'门口摄像头', time:'7/28 10:15:22', text:'请问这个<mark>快递</mark>是隔壁房间的吗？' },
  { id:3, source:'客厅摄像头', time:'7/27 16:40:05', text:'我已经收到<mark>快递</mark>派送短信了。' },
  { id:4, source:'行车记录仪', time:'7/25 11:20:18', text:'前面停着一辆<mark>快递</mark>派送车。' }
];

let activeHitId = 1;

function renderHits() {
  const container = document.getElementById('hitsList');
  container.innerHTML = searchHits.map(h => `
    <div class="hit-card${h.id === activeHitId ? ' active' : ''}" onclick="activeHitId=${h.id};renderHits();showToast('加载命中片段上下文')">
      <div class="hit-card-top">
        <span class="hit-source">${h.source}</span>
        <span class="hit-time">${h.time}</span>
      </div>
      <div class="hit-snippet">${h.text}</div>
    </div>
  `).join('');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2500);
}

renderHits();
</script>
</body>
</html>
