services:
  clipline:
    image: evanqu/clipline:latest
    container_name: clipline
    ports:
      - "${CLIPLINE_HTTP_PORT:-8080}:8080"
    volumes:
      - "${CLIPLINE_DATA_HOST:-./data}:/app/data"
      - "${CLIPLINE_RECORDINGS_HOST:-./recordings}:/recordings/xiaomi-nas:ro"
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - CLIPLINE_RECORDINGS_ROOT=/recordings
      - CLIPLINE_SKIP_RECENT_SECONDS=${CLIPLINE_SKIP_RECENT_SECONDS:-30}
      - CLIPLINE_MAX_EXPORT_MINUTES=${CLIPLINE_MAX_EXPORT_MINUTES:-30}
      # ASR 语音识别配置
      - CLIPLINE_ASR_MODEL=${CLIPLINE_ASR_MODEL:-funasr}
      - CLIPLINE_ASR_MODEL_SIZE=${CLIPLINE_ASR_MODEL_SIZE:-medium}
      - CLIPLINE_ASR_DEVICE=${CLIPLINE_ASR_DEVICE:-auto}
      - CLIPLINE_ASR_LANGUAGE=${CLIPLINE_ASR_LANGUAGE:-zh}
      - CLIPLINE_ASR_AUTO_TRANSCRIBE=${CLIPLINE_ASR_AUTO_TRANSCRIBE:-false}
      - CLIPLINE_ASR_HOTWORDS=${CLIPLINE_ASR_HOTWORDS:-}
    restart: unless-stopped
