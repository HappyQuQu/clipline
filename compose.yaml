name: clipline-phase-one
services:
  clipline:
    build:
      context: .
    image: ${CLIPLINE_IMAGE_NAME:-clipline}:${CLIPLINE_IMAGE_TAG:-dev}
    user: "${CLIPLINE_UID:-1000}:${CLIPLINE_GID:-1000}"
    cpus: ${CLIPLINE_CPU_LIMIT:-0}
    mem_limit: ${CLIPLINE_MEMORY_LIMIT:-0}
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "${CLIPLINE_HTTP_BIND:-0.0.0.0}:${CLIPLINE_HTTP_PORT:-8080}:8080"
    volumes:
      - ${CLIPLINE_DATA_DIR:?set-a-local-writable-data-directory}:/app/data
      - ${CLIPLINE_RECORDINGS_DIR:?set-the-recordings-directory}:/recordings:ro
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
